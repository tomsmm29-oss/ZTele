name: Broadcast Update to All Bots

on:
  push:
    branches:
      - main
      - master

jobs:
  ping-bots:
    runs-on: ubuntu-latest
    steps:
      - name: Send Detailed Payload
        run: |
          URLS="${{ secrets.BOT_URLS }}"
          if [ -z "$URLS" ]; then
            echo "❌ Error: Secret BOT_URLS is missing!"
            exit 1
          fi

          echo "🚀 Starting Broadcast..."
          # إرسال بيانات الحدث بالكامل (التي تحتوي على رابط السحب والفرع)
          IFS=',' read -ra ADDR <<< "$URLS"
          for i in "${ADDR[@]}"; do
            i=$(echo $i | xargs)
            echo "📡 Pinging $i"
            curl -s -X POST -H "Content-Type: application/json" -d @"$GITHUB_EVENT_PATH" "$i"
          done
