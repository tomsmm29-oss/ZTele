name: Broadcast Update to All Bots

on:
  push:
    branches:
      - main
      - master

jobs:
  ping-bots:
    runs-on: ubuntu-latest
    steps:
      - name: Send Webhook Payload to all configured bots
        env:
          WEBHOOKS: ${{ secrets.BOT_URLS }}
        run: |
          # التحقق من وجود الروابط
          if [ -z "$WEBHOOKS" ]; then
            echo "❌ Error: BOT_URLS secret is empty!"
            exit 1
          fi

          # تقسيم الروابط وإرسال الإشارة
          IFS=',' read -ra ADDR <<< "$WEBHOOKS"
          for url in "${ADDR[@]}"; do
            url=$(echo $url | xargs) # إزالة المسافات
            if [ ! -z "$url" ]; then
              echo "🚀 Sending update signal to: $url"
              # إرسال البيانات باستخدام curl مع تجاهل الأخطاء البسيطة
              curl -s -X POST -H "Content-Type: application/json" -d "{\"ref\": \"$GITHUB_REF\", \"commits\": [{\"modified\": [\"zlzl/plugins/ايدي.py\"]}]}" "$url"
            fi
          done
